name: Deploy

# Deploys are deliberate. Pushing to an app repo publishes a build artifact but does not
# reach production until this workflow runs and pulls the artifacts in.
on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      # Must run after the build (and after generateSocialMeta.js, which `build` invokes)
      # so nothing overwrites an extracted app's index.html.
      - name: Fetch app build artifacts
        run: node scripts/fetchApps.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PORTFOLIO_4B9FE }}
          channelId: live
          projectId: portfolio-4b9fe
